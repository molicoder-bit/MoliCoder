name: Build Windows app

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e .
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest
      - name: Build
        run: python -m PyInstaller --noconfirm --clean LocalModelChat.spec
      - name: Archive
        shell: pwsh
        run: Compress-Archive -Path dist/LocalModelChat/* -DestinationPath LocalModelChat-Windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: LocalModelChat-Windows-x64
          path: LocalModelChat-Windows-x64.zip
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: LocalModelChat-Windows-x64.zip
