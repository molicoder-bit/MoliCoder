name: Build Windows app

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e .
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest
      - name: Build
        run: python -m PyInstaller --noconfirm --clean LocalModelChat.spec
      - name: Check packaged app
        shell: pwsh
        run: |
          Copy-Item LICENSE dist/MoliCoder/LICENSE
          Copy-Item NOTICE dist/MoliCoder/NOTICE
          $process = Start-Process -FilePath (Resolve-Path dist/MoliCoder/MoliCoder.exe) -ArgumentList '--package-smoke-check' -WindowStyle Hidden -PassThru
          if (-not $process.WaitForExit(15000)) {
            Stop-Process -Id $process.Id -ErrorAction SilentlyContinue
            throw 'Packaged health check timed out'
          }
          if ($process.ExitCode -ne 0) { throw "Packaged health check failed: $($process.ExitCode)" }
      - name: Archive
        shell: pwsh
        run: Compress-Archive -Path dist/MoliCoder/* -DestinationPath MoliCoder-Windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: MoliCoder-Windows-x64
          path: MoliCoder-Windows-x64.zip
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: MoliCoder-Windows-x64.zip
