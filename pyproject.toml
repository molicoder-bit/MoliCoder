[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "local-model-chat"
version = "0.1.2"
description = "A private, native desktop chat interface for local Ollama models."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "PySide6==6.11.2",
]

[project.optional-dependencies]
dev = [
  "PyInstaller==6.22.2",
  "pytest==9.1.1",
  "pytest-qt==4.5.0",
]

[project.scripts]
local-model-chat = "local_model_chat.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
