[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "local-model-chat"
version = "1.1.2"
description = "Local-first coding chat and Build with visible token and usage controls."
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = [
  "PySide6==6.11.2",
  "zstandard==0.25.0",
]

[project.urls]
Source = "https://github.com/molicoder-bit/MoliCoder"
Issues = "https://github.com/molicoder-bit/MoliCoder/issues"

[project.optional-dependencies]
remote = [
  "cryptography==50.0.2",
]
dev = [
  "PyInstaller==6.22.2",
  "pytest==9.1.1",
  "pytest-qt==4.5.0",
  "cryptography==50.0.2",
]

[project.scripts]
local-model-chat = "local_model_chat.main:main"
molicoder-exec = "local_model_chat.molicoder.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
local_model_chat = ["molicoder/planner/plan.schema.json", "environment/manifests/releases.json"]

[tool.setuptools.packages.find]
where = ["src"]
